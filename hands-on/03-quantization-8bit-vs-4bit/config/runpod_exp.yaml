  q35-4b-bf16:  {hf_id: Qwen/Qwen3.5-4B, revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a, size_b: 4, precision: bf16, source: official, weight_gb: 9.32}
  q35-4b-fp8:   {hf_id: Qwen/Qwen3.5-4B, revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a, size_b: 4, precision: fp8, source: online, quantization: fp8, weight_gb: 5.0}
  q35-4b-awq:   {hf_id: cyankiwi/Qwen3.5-4B-AWQ-4bit, revision: d3e78b50c727b1f34802f440ca84b25781625352, size_b: 4, precision: awq, source: community, weight_gb: 4.04}
  q35-9b-bf16:  {hf_id: Qwen/Qwen3.5-9B, revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a, size_b: 9, precision: bf16, source: official, weight_gb: 19.31}
